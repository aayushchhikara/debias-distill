# Base experiment config. Copy and override per run.
seed: 1234
device: mps            # falls back to cpu if MPS unavailable

data:
  swaps_dir: data/swaps
  templates_dir: data/templates
  corpus_dir: data/corpus
  cache_dir: cache
  experiments_dir: experiments

teacher: EleutherAI/pythia-410m
teacher_revision: 9879c9b5f8bea9051dcb0e68dff21493d67e9d4f
student: EleutherAI/pythia-70m
student_revision: a39f36b100fe8a5377810d56c3f4789b9c53ac42

corpus:
  name: HuggingFaceFW/fineweb    # ODC-By (Common Crawl derived; attribution required)
  revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  data_dir: sample/10BT
  token_budget: 10_000_000       # recommended range: 5–20M
  seq_len: 512

topk: 50                         # teacher tokens stored per position, plus the residual mass

teacher_cache:
  batch_pairs: 8                 # rows per batch = 2 x this (each row with its swapped copy)
  flush_every: 20                # batches between checkpoints

distill:
  arm: A                         # label used in run names
  data: originals                # originals | both (originals and their swapped copies)
  target: plain                  # plain | mean | aligned | hard (next-token labels, no teacher)
  lr: 1.0e-4
  batch_size: 8
  grad_accum: 4                  # optimizer step every batch_size x grad_accum rows
  steps: 942                     # optimizer steps, the same for every arm (two passes over the originals)
  warmup_steps: 47               # 5% of the steps
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_every: 50           # optimizer steps between resumable checkpoints
  log_every: 10

loop:
  rounds: 3                      # recommended range: 3–5
  min_improvement: 0.05
  max_capability_drop: 0.05

eval:
  split: dev
  perplexity_tokens: 200_000

benchmarks:
  crows_pairs:                   # CC BY-SA 4.0; evaluation only; kept in a gitignored folder
    path: data/benchmarks/crows_pairs_anonymized.csv
    url: https://raw.githubusercontent.com/nyu-mll/crows-pairs/8aaac11c485473159ec9328a65253a5be9a479dc/data/crows_pairs_anonymized.csv
    sha256: dfb36986ce0502abbaf7055b9176da3d08d48e07df1251991b5dfbcbceab9d0c
