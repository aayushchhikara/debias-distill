# Base experiment config. Copy and override per run.
seed: 1234
device: mps            # falls back to cpu if MPS unavailable

data:
  swaps_dir: data/swaps
  templates_dir: data/templates
  corpus_dir: data/corpus
  cache_dir: cache

teacher: EleutherAI/pythia-410m
teacher_revision: 9879c9b5f8bea9051dcb0e68dff21493d67e9d4f
student: EleutherAI/pythia-70m
student_revision: a39f36b100fe8a5377810d56c3f4789b9c53ac42

corpus:
  name: HuggingFaceFW/fineweb    # ODC-By (Common Crawl derived; attribution required)
  revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  data_dir: sample/10BT
  token_budget: 10_000_000       # recommended range: 5–20M
  seq_len: 512

topk: 50                         # teacher tokens stored per position, plus the residual mass

teacher_cache:
  batch_pairs: 8                 # rows per batch = 2 x this (each row with its swapped copy)
  flush_every: 20                # batches between checkpoints

distill:
  target: plain
  temperature: 1.0
  lr: 1.0e-4
  batch_size: 8
  grad_accum: 4
  epochs: 1
  hard_label_weight: 0.0         # λ for optional hard-label CE term
  dtype: float32                 # the student trains as fast in fp32 as in bf16 on MPS
  checkpoint_every: 500          # steps

loop:
  rounds: 3                      # recommended range: 3–5
  min_improvement: 0.05
  max_capability_drop: 0.05

eval:
  split: dev
  perplexity_tokens: 200_000
