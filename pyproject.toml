[project]
name = "debias-distill"
version = "0.1.0"
description = "A study of de-bias-ing LLMs using distillation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "pyarrow>=15.0",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[tool.poetry]
packages = [{ include = "debias_distill", from = "src" }]

[tool.poetry.group.eval.dependencies]
lm-eval = ">=0.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads models or runs on the accelerator; run with -m slow"]

[tool.ruff]
line-length = 100
target-version = "py312"
